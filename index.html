<title>PLAN·T · 영어발전소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ---------- 토큰 ---------- */
:root{
  /* v5 · 깔끔 (A.PATH 리포트 모양) · 토큰은 여기 한 곳에서만 */
  --navy:#141B2D;--navy2:#1F2A44;--navy3:#8E97B2;
  --bg:#F5F7FB;--card:#fff;--line:#E3E7EF;--line2:#ECEFF4;--soft:#F6F8FB;
  --ink:#141B2D;--sub:#4A5366;--mute:#5B6478;
  --pri:#2F6BE0;--pri2:#1D3FA6;--pribg:#E7EEFC;--pribd:#C9D7F6;
  --brand:#FFBD59;--brand2:#F5B041;--brandink:#9A5B00;--brandbg:#FFF6E6;
  --grn:#13734D;--grnbg:#E3F4EC;--amb:#94570A;--ambbg:#FDF0DC;--red:#C23A2E;--redbg:#FDECEA;
  --sh1:0 1px 2px rgba(16,24,40,.03);--sh2:0 4px 16px rgba(16,24,40,.06);
  /* 예전 이름 · 기존 화면 코드가 그대로 쓰도록 */
  --or:var(--pri);--or2:var(--pri2);--orbg:var(--pribg);--blk:var(--navy)
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',system-ui,-apple-system,sans-serif;color:var(--ink);font-size:14.5px;line-height:1.5;
  display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh;font-feature-settings:'tnum' 1}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* ---------- 사이드바 ---------- */
#side{background:#fff;color:var(--ink);border-right:1px solid var(--line);z-index:20}
.sidein{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 10px 0}
.brand .bt{display:flex;align-items:center;gap:7px}.brand b{font-size:15px;font-weight:800;letter-spacing:-.3px}
.plant{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--mute)}.brand .plant{padding-left:27px}.plant i{font-style:normal;color:#E08A00}
#nav{display:flex;flex-direction:column;gap:2px;flex:1}
#nav .ng{font-size:12px;color:var(--mute);font-weight:700;padding:14px 12px 4px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#nav .ng b{color:var(--ink);font-weight:700}
#nav .ng:first-child{padding-top:2px}
#nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--sub);font:inherit;font-size:14px;font-weight:600;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;min-height:40px}
#nav button:hover{background:var(--soft);color:var(--ink)}
#nav button.on{background:var(--pribg);color:var(--pri2);font-weight:800}
#nav button svg{flex:none;opacity:.85}#nav .subn{display:none;flex-direction:column;gap:1px;margin:0 0 4px 26px;border-left:1px solid var(--line);padding-left:6px}#nav .subn.open{display:flex}#nav .subn button{min-height:34px;padding:6px 10px;font-size:13.5px}#nav button.grp.on-g{color:var(--ink);font-weight:800}#nav button.grp::after{content:'▾';margin-left:auto;font-size:11px;opacity:.6}
#nav .nbot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.sidefoot{font-size:12.5px;color:var(--mute);padding:0 12px;line-height:1.5}
.sidefoot b{display:inline-block;background:#E6F5EF;color:#0B6446;font-size:12px;border-radius:5px;padding:1px 6px;margin-bottom:4px}

/* ---------- 본문 ---------- */
main{padding:26px 34px 80px;display:flex;flex-direction:column;gap:16px;max-width:1260px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.5px}
h2{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.2px}
h3{margin:0;font-size:14.5px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g7{grid-template-columns:repeat(7,minmax(0,1fr))}
.small{font-size:12.5px;color:var(--mute)}.label{font-size:12.5px;font-weight:600;color:var(--sub)}.note{font-size:12.5px;color:var(--mute);line-height:1.65}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;background:var(--pribg);border-radius:16px;padding:20px 24px}.ph .small{margin-top:4px}

/* 상태 표시 */
.pill{padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700;display:inline-block;white-space:nowrap;line-height:1.5}
.b-safe{background:var(--grnbg);color:var(--grn)}.b-fit{background:var(--pribg);color:var(--pri2)}.b-try{background:var(--ambbg);color:var(--amb)}.b-up{background:#FFE9DC;color:#B4430F}.b-over{background:var(--redbg);color:var(--red)}.b-gray{background:#EEF0F4;color:var(--sub)}.b-blk{background:var(--navy);color:#fff}
.gap-ok{color:var(--grn);font-weight:700}.gap-no{color:var(--sub);font-weight:700}.gap-bad{color:var(--red);font-weight:700}

/* 입력 · 버튼 */
.chip{min-height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13.5px;cursor:pointer;color:var(--sub)}
.chip:hover{border-color:#C7CEDB}
.chip.on{background:var(--navy);border-color:var(--navy);font-weight:700;color:#fff}
.chip.on .small{color:#C9CFE0}
.btn{min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#C7CEDB}
.btn:disabled{opacity:.45;cursor:default}
.btn.dark{background:var(--pri);color:#fff;border-color:var(--pri);padding:0 14px;border-radius:8px}.btn.dark.sm{padding:0 10px}.btn.or{background:var(--pri);border-color:var(--pri);color:#fff}.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px}.btn.danger{color:var(--red)}
.seg{display:inline-flex;background:#EBEEF4;border-radius:9px;padding:3px;flex-wrap:wrap}.seg button{border:0;background:none;font:inherit;font-weight:600;font-size:13.5px;padding:6px 14px;border-radius:7px;color:var(--sub);cursor:pointer;min-height:32px}.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(27,36,64,.12)}
.seg.or button.on{background:var(--navy);color:#fff}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{min-height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:14.5px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--pri);outline:0;box-shadow:0 0 0 3px var(--pribg)}
textarea{padding:10px;min-height:90px;width:100%}
select,input{max-width:100%}
input.num{width:72px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--pri)}label:has(> input[type=checkbox]),label:has(> input[type=radio]){min-height:40px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.ihelp{min-width:32px;min-height:32px}.pill{font-size:12.5px}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:transparent;text-align:left;color:var(--sub);font-weight:700;font-size:12.5px;padding:9px 10px;white-space:nowrap;border-bottom:1.5px solid #D5DBE6}
td{padding:10px;border-top:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
.scroll{overflow-x:auto}
.grp{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.grp>button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--soft);border:0;font:inherit;cursor:pointer;min-height:44px;text-align:left;color:var(--ink)}
.grp>button:disabled{cursor:default;opacity:.55}

/* 요약 패널 · 인사이트 바 */
.dark{background:var(--pribg);color:var(--ink);border:1px solid var(--pribd);border-radius:10px;padding:14px 16px}.dark .small{color:var(--sub)}
.dark b[style*="#fff"],.dark [style*="color:#fff"]{color:var(--ink)!important}
.ins{background:var(--pribg);border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.65;color:var(--ink)}
.ins b.lead{color:var(--pri2);margin-right:6px}
.ins.warn{background:var(--ambbg)}.ins.warn b.lead{color:var(--amb)}
.ins.empty{background:var(--soft);color:var(--mute)}

/* 학생 헤더 */
.sh{display:flex;flex-direction:column;gap:14px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;background:var(--pribg);border-radius:16px;padding:18px 22px}
#view .row.between:has(> .col > .crumb[data-go2]){background:var(--pribg);border-radius:16px;padding:18px 22px} /* 공부 계획 · 플래너 · 점검 · 습관 등 학생 화면 제목줄 (stuPicker) */
.crumb{background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--mute);cursor:pointer;align-self:flex-start}
.crumb:hover{color:var(--pri)}
.sh-meta{font-size:14px;color:var(--sub)}
select.pick{min-height:34px;font-size:13px;color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k{font-size:12px;color:var(--mute);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v.t{font-size:15.5px;font-weight:700;letter-spacing:-.2px;padding:3px 0 2px}
.kpi .s{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;font:inherit;font-size:14px;font-weight:500;color:var(--mute);padding:10px 12px 11px;margin-bottom:-1px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{font-weight:800}

/* 갈 수 있는 곳 3열 */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lane{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;background:#fff}
.lane h3{display:flex;align-items:baseline;gap:6px}.lane h3 span{font-size:12.5px;color:var(--mute);font-weight:500}
.lane .li{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line2)}
.lane .li b{font-weight:600}.lane.up{border-top:3px solid #E46B2A}.lane.fit{border-top:3px solid var(--pri)}.lane.safe{border-top:3px solid var(--grn)}

/* 접기 */
details.fold{background:#fff;border:1px solid var(--line);border-radius:12px}
details.fold>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 20px;cursor:pointer}
details.fold>summary h2{font-size:15.5px}
details.fold>summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(225deg)}
details.fold>.fb{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px}
details.fold>.fb>section.card{border:0;padding:0}
details.fold>.fb>section.card>.row.between:first-child>h2{display:none}
details.fold>.fb>section.card>h2:first-child{display:none}
details.src>summary{font-size:12.5px;color:var(--sub);cursor:pointer;display:inline-flex;gap:5px;align-items:center}
details.src>summary:hover{color:var(--pri)}
details.src[open]>summary{margin-bottom:4px}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}

/* 기존 구성요소 */
.bat{flex:1;height:18px;border:2px solid var(--ink);border-radius:5px;padding:2px;display:flex;min-width:80px}.bat i{display:block;border-radius:2px}
.phone{width:400px;max-width:100%;min-height:780px;background:var(--navy);border-radius:34px;padding:10px;margin:0 auto;box-shadow:0 20px 50px rgba(27,36,64,.25)}
.screen{min-height:760px;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;background:var(--pribg);color:var(--ink)}
.sheet{flex:1;background:var(--bg);color:var(--ink);border-radius:22px 22px 0 0;padding:14px;display:flex;flex-direction:column;gap:10px}
.task{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.task.run{border:2px solid var(--pri)}
.day{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:160px}
.blk{border-radius:7px;padding:7px 8px;font-size:12px;line-height:1.4;border:1px solid var(--line2);background:var(--soft)}
.blkc select{min-height:24px;font-size:11.5px;padding:0 2px;border-color:transparent;background:transparent;color:var(--mute)}.blkc .btn{min-height:24px;border:0;background:none;color:var(--mute);padding:0 4px;font-size:11.5px;font-weight:500}.blkc .btn:hover{color:var(--red)}
.blk.done{background:var(--grnbg);border-color:#BFE3D3}
.sub-국어{border-left:4px solid #6C4AB6}.sub-수학{border-left:4px solid #E46B2A}.sub-영어{border-left:4px solid #2F5BEA}.sub-통합사회{border-left:4px solid #12805C}.sub-통합과학{border-left:4px solid #B8860B}.sub-기타{border-left:4px solid #9AA2B1}
.empty{padding:30px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:80;display:none}.ghpop{position:fixed;z-index:85;background:#fff;color:#1A2233;border:1.5px solid #1B2440;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hide{display:none!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.ex{font-size:12.5px;font-weight:700;color:var(--pri2);background:var(--pribg);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
#print{display:none}
.rkbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:#fff}

async function writeState(str, baseVer, email) {

  try { window.__PLANT = await loadDB(keyDoc.data().k); } catch (e) { started = false; return gateMsg('대학 DB를 열지 못했어요 · 새로고침해 주세요'); }
  gateMsg('학생 데이터 받는 중…');
  let st; try { st = await readState(); } catch (e) { started = false; return gateMsg('학생 데이터를 받지 못했어요 · 인터넷 연결을 확인하고 새로고침해 주세요'); }
  try {
    const local = localStorage.getItem(ENC_KEY);
    if (st.str) { if (local && local !== st.str) localStorage.setItem(ENC_KEY + '_local_backup', local); localStorage.setItem(ENC_KEY, st.str); }
    // 클라우드가 비어 있으면 이 기기에 있던 기존 데이터가 첫 저장 때 그대로 올라감
  } catch (e) { }
  window.__PLANT_CLOUD = {
    ver: st.ver, email: user.email,
    write: (str, baseVer) => writeState(str, baseVer, user.email),
    createStaff, removeStaff, stu: STUAPI,
    watch: cb => onSnapshot(doc(fs, 'state', 'main'), async s => { if (s.metadata.hasPendingWrites || !s.exists()) return; const d = s.data(); cb(d.ver || 0, () => readParts(d.n || 0, getDoc), d.by); }),
    status: t => { const e = $g('cloudSt'); if (e) e.textContent = t; }
  };
  bar(user, isOwner);
  showGate(false);
  try { await runApp(keyDoc.data().k, user.email); } catch (e) { started = false; showGate(true); return gateMsg('앱을 열지 못했어요 · 새로고침해 주세요'); }
  // 비밀번호로 들어온 경우 · 같은 비밀번호로 학원 잠금까지 한 번에 열기
  if (AUTOPW) { const pw = AUTOPW; AUTOPW = null; setTimeout(() => { const i = $g('pw1'), b = $g('pwGo'); if (i && b && !$g('pw2')) { i.value = pw; b.click(); } }, 50); }
}

$g('gateBtn').onclick = async () => {
  gateMsg('');
  try { const r = await signInWithPopup(auth, new GoogleAuthProvider()); enter(r.user); }
  catch (e) { gateMsg(e && e.code === 'auth/popup-blocked' ? '팝업이 막혔어요 · 주소창 오른쪽에서 팝업 허용 후 다시 눌러 주세요' : '로그인을 마치지 못했어요 · 다시 눌러 주세요'); }
};
$g('gateOut').onclick = async () => { await signOut(auth); location.reload(); };
function setMode(m) { document.querySelectorAll('#gateTabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); $g('gateStaffWrap').style.display = m === 'stu' ? 'none' : ''; $g('gateStu').style.display = m === 'stu' ? '' : 'none'; $g('gateFoot').style.display = m === 'stu' ? 'none' : ''; try { localStorage.setItem('plant_mode', m); } catch (e) { } gateMsg(''); }
document.querySelectorAll('#gateTabs button').forEach(b => b.onclick = () => setMode(b.dataset.m));
{ let m = 'staff'; try { m = new URLSearchParams(location.search).get('m') === 'stu' ? 'stu' : (localStorage.getItem('plant_mode') || 'staff'); const id = localStorage.getItem('plant_stuid'); if (id) $g('stuId').value = id; } catch (e) { } setMode(m); }
$g('stuGo').onclick = stuLogin; $g('stuPw').onkeydown = e => { if (e.key === 'Enter') stuLogin(); };
$g('gateGo').onclick = pwLogin; $g('gatePw').onkeydown = e => { if (e.key === 'Enter') pwLogin(); };
onAuthStateChanged(auth, u => { if (u) enter(u); else { showGate(true); $g('gateBtn').style.display = ''; gateMsg(''); staffGate(); } });

</script>
</body>
</html>
